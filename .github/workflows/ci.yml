name: Validate demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install '.[local,portal]'
      - run: brfss demo --fixture --out out/ci
      - run: python tests/assert_fixture.py
      - run: claims demo
      - run: python tests/assert_claims_demo.py
      - run: python evaluation/evaluate_agent.py
      - run: python -m unittest discover -s tests
      - run: python tests/portal_smoke.py
