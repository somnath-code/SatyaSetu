<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block head %}{% endblock %}
  <title>{% block title %}SatyaSetu{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}">
</head>
<body>
<header class="top">
  <div class="shell top-inner">
    <a class="brand" href="{{ url_for('home') }}"><span class="mark">S</span> SatyaSetu</a>
    <a class="nav" href="{{ url_for('home') }}#activity">Run history</a>
  </div>
</header>
<main class="shell">
  {% for category, message in get_flashed_messages(with_categories=true) %}
  <p class="notice {{ category }}" role="status">{{ message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<footer class="shell footer">SatyaSetu · Healthcare data assurance</footer>
</body>
</html>
